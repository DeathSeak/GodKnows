[project]
name = "frugal"
version = "2.0.0"
description = "Token firewall for AI coding agents"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.1.2",
    "google-generativeai>=0.8.0",
    "toml>=0.10.2",
    "click>=8.0.0",
    "tiktoken>=0.14.0",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
frugal = "frugal.cli:main"


[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
